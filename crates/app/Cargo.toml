[package]
name = "pyxillum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native cross-platform desktop GUI application for Pyxillum"

[[bin]]
name = "pyxillum-desktop"
path = "src/main.rs"

[dependencies]
pyxillum-protocol = { path = "../protocol" }
pyxillum-transport = { path = "../transport" }
pyxillum-sim = { path = "../sim" }
pyxillum-core = { path = "../core" }
eframe.workspace = true
egui.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.52.0"
features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]


