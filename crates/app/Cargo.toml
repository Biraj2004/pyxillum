[package]
name = "pyxillum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native cross-platform desktop GUI application for Pyxillum"

[[bin]]
name = "pyxillum-desktop"
path = "src/main.rs"

[dependencies]
pyxillum-protocol = { path = "../protocol" }
pyxillum-transport = { path = "../transport" }
pyxillum-sim = { path = "../sim" }
pyxillum-core = { path = "../core" }
eframe.workspace = true
egui.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true

