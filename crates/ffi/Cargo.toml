[package]
name = "pyxillum-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI cross-platform language bindings surface for Pyxillum Core"

[lib]
crate-type = ["cdylib", "rlib"]
name = "pyxillum_ffi"

[dependencies]
pyxillum-core = { path = "../core" }
pyxillum-protocol = { path = "../protocol" }
pyxillum-transport = { path = "../transport" }
pyxillum-audio = { path = "../audio" }
uniffi = { version = "0.28.3", features = ["cli"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }
thiserror.workspace = true

[build-dependencies]
uniffi = { version = "0.28.3", features = ["build"] }
