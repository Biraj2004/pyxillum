<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Pyxillum App Icon</title>
  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="#0B0F19"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Pixel interconnect traces -->
  <g fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <line x1="160" y1="160" x2="352" y2="352"/>
    <line x1="160" y1="352" x2="352" y2="160"/>
    <line x1="256" y1="120" x2="256" y2="392"/>
    <line x1="120" y1="256" x2="392" y2="256"/>
    <circle cx="256" cy="256" r="144" stroke="#1E293B" stroke-width="10"/>
  </g>

  <!-- Corner satellites -->
  <circle cx="160" cy="160" r="18" fill="#334155"/>
  <circle cx="352" cy="160" r="18" fill="#334155"/>
  <circle cx="160" cy="352" r="18" fill="#334155"/>
  <circle cx="352" cy="352" r="18" fill="#334155"/>

  <!-- Primary RGB pixel emitters -->
  <!-- Top: Electric Cyan -->
  <circle cx="256" cy="120" r="38" fill="#00E5FF"/>
  <circle cx="256" cy="120" r="16" fill="#FFFFFF"/>

  <!-- Right: Amber Glow -->
  <circle cx="392" cy="256" r="38" fill="#FF9500"/>
  <circle cx="392" cy="256" r="16" fill="#FFFFFF"/>

  <!-- Bottom: Deep Violet -->
  <circle cx="256" cy="392" r="38" fill="#8B5CF6"/>
  <circle cx="256" cy="392" r="16" fill="#FFFFFF"/>

  <!-- Left: Emerald Green -->
  <circle cx="120" cy="256" r="38" fill="#10B981"/>
  <circle cx="120" cy="256" r="16" fill="#FFFFFF"/>

  <!-- Central Master Pixel -->
  <circle cx="256" cy="256" r="62" fill="#0B0F19" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="256" cy="256" r="34" fill="#FFFFFF"/>
</svg>
