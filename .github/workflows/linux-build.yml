name: Build Linux Desktop

on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0, or leave blank to auto-increment from latest tag)'
        required: false
        default: ''
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (.deb, .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Bluetooth and GUI Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Compute Build Version
        id: version
        shell: bash
        run: |
          git fetch --tags --force 2>/dev/null || true

          input_version="${{ github.event.inputs.version }}"
          input_version="$(echo "$input_version" | xargs)"
          ref="${{ github.ref }}"

          if [ -n "$input_version" ] && [ "$input_version" != "auto" ]; then
              version="${input_version#v}"
          elif [[ "$ref" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              version="${BASH_REMATCH[1]}"
          else
              latest_tag=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
              if [ -z "$latest_tag" ]; then
                  version="1.0.0"
              else
                  major=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1/')
                  minor=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\2/')
                  patch=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\3/')
                  next_patch=$((patch + 1))
                  version="${major}.${minor}.${next_patch}"
              fi
          fi

          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${version} (Tag: ${tag})"

      - name: Build Release Binaries
        run: cargo build --release -p pyxillum-app -p pyxillum-cli

      - name: Package Linux Artifacts
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p staging

          # 1. Standalone Executables
          cp target/release/pyxillum-desktop "staging/Pyxillum-Desktop-Linux-x86_64-v${version}"
          chmod +x "staging/Pyxillum-Desktop-Linux-x86_64-v${version}"

          cp target/release/pyxillum "staging/pyxillum-cli-Linux-x86_64-v${version}"
          chmod +x "staging/pyxillum-cli-Linux-x86_64-v${version}"

          # 2. Portable Tarball Bundle
          tar_root="Pyxillum-Linux-x86_64-v${version}"
          mkdir -p "${tar_root}"
          cp target/release/pyxillum-desktop "${tar_root}/pyxillum-desktop"
          cp target/release/pyxillum "${tar_root}/pyxillum"
          cp assets/icons/icon-512.png "${tar_root}/pyxillum.png"
          cp README.md LICENSE "${tar_root}/"

          cat <<EOF > "${tar_root}/pyxillum.desktop"
          [Desktop Entry]
          Name=Pyxillum
          Comment=Native Bluetooth Low Energy pixel LED controller
          Exec=pyxillum-desktop
          Icon=pyxillum
          Terminal=false
          Type=Application
          Categories=Utility;HardwareSettings;
          EOF

          tar -czvf "staging/Pyxillum-Linux-x86_64-v${version}.tar.gz" "${tar_root}"

          # 3. Debian / Ubuntu Package (.deb)
          deb_root="deb_build/pyxillum_${version}_amd64"
          mkdir -p "${deb_root}/DEBIAN"
          mkdir -p "${deb_root}/usr/bin"
          mkdir -p "${deb_root}/usr/share/applications"
          mkdir -p "${deb_root}/usr/share/icons/hicolor/512x512/apps"

          cp target/release/pyxillum-desktop "${deb_root}/usr/bin/pyxillum-desktop"
          cp target/release/pyxillum "${deb_root}/usr/bin/pyxillum"
          chmod +x "${deb_root}/usr/bin/pyxillum-desktop" "${deb_root}/usr/bin/pyxillum"

          cp assets/icons/icon-512.png "${deb_root}/usr/share/icons/hicolor/512x512/apps/pyxillum.png"
          cp "${tar_root}/pyxillum.desktop" "${deb_root}/usr/share/applications/pyxillum.desktop"

          cat <<EOF > "${deb_root}/DEBIAN/control"
          Package: pyxillum
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pyxillum Contributors <pyxillum@github.com>
          Depends: libdbus-1-3, libxkbcommon0, libgl1
          Description: Native Bluetooth Low Energy pixel LED controller
           Pyxillum is a lightweight, cross-platform controller for BLE pixel LED strips
           of the SP621E/SP6xxE hardware family.
          EOF

          dpkg-deb --build "${deb_root}" "staging/pyxillum_${version}_amd64.deb"

          # 4. Compute SHA-256 Checksums
          cd staging
          sha256sum * > linux-checksums-sha256.txt
          cd ..

          ls -lh staging/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Pyxillum v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ fromJson(github.event.inputs.prerelease || 'false') }}
          generate_release_notes: true
          files: staging/*
