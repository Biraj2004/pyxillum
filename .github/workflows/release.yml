name: Unified Multi-Platform Release

on:
  push:
    branches: [ "master", "release" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0, or leave blank to auto-increment from latest tag)'
        required: false
        default: ''
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Build Version
        id: ver
        shell: bash
        run: |
          git fetch --tags --force 2>/dev/null || true

          input_version="${{ github.event.inputs.version }}"
          input_version="$(echo "$input_version" | xargs)"
          ref="${{ github.ref }}"

          if [ -n "$input_version" ] && [ "$input_version" != "auto" ]; then
              version="${input_version#v}"
          elif [[ "$ref" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              version="${BASH_REMATCH[1]}"
          else
              latest_tag=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
              if [ -z "$latest_tag" ]; then
                  version="1.0.0"
              else
                  major=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1/')
                  minor=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\2/')
                  patch=$(echo "$latest_tag" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\3/')
                  next_patch=$((patch + 1))
                  version="${major}.${minor}.${next_patch}"
              fi
          fi

          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${version} (Tag: ${tag})"

  build-windows:
    name: Build Windows (.exe, .msi)
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v3-

      - name: Configure WiX Toolset Path
        shell: pwsh
        run: |
          $wixCandidate = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixCandidate) {
              Write-Host "Found pre-installed WiX Toolset at $wixCandidate"
              "$wixCandidate" >> $env:GITHUB_PATH
          } else {
              Write-Host "WiX directory not found at standard path, installing via Chocolatey"
              choco install wixtoolset -y --no-progress
              if (Test-Path $wixCandidate) {
                  Write-Host "Adding installed WiX Toolset to GITHUB_PATH"
                  "$wixCandidate" >> $env:GITHUB_PATH
              }
          }

      - name: Build Release Binaries
        run: cargo build --release -p pyxillum-app -p pyxillum-cli

      - name: Build WiX MSI Installer
        run: cargo xtask msi
        continue-on-error: true

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.version }}"
          $staging = "windows-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # 1. Standalone Desktop GUI executable
          Copy-Item "target/release/pyxillum-desktop.exe" -Destination "$staging/Pyxillum-Desktop-Windows-x64-v$version.exe" -Force

          # 2. Standalone CLI utility
          Copy-Item "target/release/pyxillum.exe" -Destination "$staging/pyxillum-cli-Windows-x64-v$version.exe" -Force

          # 3. WiX MSI Installer if successfully built
          $msiSource = "pyxillum-v$version-x64.msi"
          if (Test-Path "dist/$msiSource") {
              Copy-Item "dist/$msiSource" -Destination "$staging/Pyxillum-Windows-x64-v$version.msi" -Force
          }

          # 4. Portable zip bundle
          $zipDir = "dist/portable_bundle"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          Copy-Item "target/release/pyxillum-desktop.exe" -Destination "$zipDir/" -Force
          Copy-Item "target/release/pyxillum.exe" -Destination "$zipDir/" -Force
          Copy-Item "README.md" -Destination "$zipDir/" -Force
          Copy-Item "LICENSE" -Destination "$zipDir/" -Force
          Compress-Archive -Path "$zipDir/*" -DestinationPath "$staging/Pyxillum-Windows-x64-v$version.zip" -Force

          Get-ChildItem -Path $staging

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: windows-staging/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Bluetooth and GUI Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-v3-

      - name: Build Release Binaries
        run: cargo build --release -p pyxillum-app -p pyxillum-cli

      - name: Stage Linux Artifacts
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          arch="${{ matrix.arch }}"
          deb_arch="${{ matrix.deb_arch }}"
          mkdir -p linux-staging

          # 1. Standalone Executables
          cp target/release/pyxillum-desktop "linux-staging/Pyxillum-Desktop-Linux-${arch}-v${version}"
          chmod +x "linux-staging/Pyxillum-Desktop-Linux-${arch}-v${version}"

          cp target/release/pyxillum "linux-staging/pyxillum-cli-Linux-${arch}-v${version}"
          chmod +x "linux-staging/pyxillum-cli-Linux-${arch}-v${version}"

          # 2. Portable Tarball Bundle
          tar_root="Pyxillum-Linux-${arch}-v${version}"
          mkdir -p "${tar_root}"
          cp target/release/pyxillum-desktop "${tar_root}/pyxillum-desktop"
          cp target/release/pyxillum "${tar_root}/pyxillum"
          cp assets/icons/icon-512.png "${tar_root}/pyxillum.png"
          cp README.md LICENSE "${tar_root}/"

          cat <<EOF > "${tar_root}/pyxillum.desktop"
          [Desktop Entry]
          Name=Pyxillum
          Comment=Native Bluetooth Low Energy pixel LED controller
          Exec=pyxillum-desktop
          Icon=pyxillum
          Terminal=false
          Type=Application
          Categories=Utility;HardwareSettings;
          EOF

          tar -czvf "linux-staging/Pyxillum-Linux-${arch}-v${version}.tar.gz" "${tar_root}"

          # 3. Debian / Ubuntu Package (.deb)
          deb_root="deb_build/pyxillum_${version}_${deb_arch}"
          mkdir -p "${deb_root}/DEBIAN"
          mkdir -p "${deb_root}/usr/bin"
          mkdir -p "${deb_root}/usr/share/applications"
          mkdir -p "${deb_root}/usr/share/icons/hicolor/512x512/apps"

          cp target/release/pyxillum-desktop "${deb_root}/usr/bin/pyxillum-desktop"
          cp target/release/pyxillum "${deb_root}/usr/bin/pyxillum"
          chmod +x "${deb_root}/usr/bin/pyxillum-desktop" "${deb_root}/usr/bin/pyxillum"

          cp assets/icons/icon-512.png "${deb_root}/usr/share/icons/hicolor/512x512/apps/pyxillum.png"
          cp "${tar_root}/pyxillum.desktop" "${deb_root}/usr/share/applications/pyxillum.desktop"

          cat <<EOF > "${deb_root}/DEBIAN/control"
          Package: pyxillum
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: ${deb_arch}
          Maintainer: Pyxillum Contributors <pyxillum@github.com>
          Depends: libdbus-1-3, libxkbcommon0, libgl1
          Description: Native Bluetooth Low Energy pixel LED controller
           Pyxillum is a lightweight, cross-platform controller for BLE pixel LED strips
           of the SP621E/SP6xxE hardware family.
          EOF

          dpkg-deb --build "${deb_root}" "linux-staging/pyxillum_${version}_${deb_arch}.deb"

          ls -lh linux-staging/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets-${{ matrix.arch }}
          path: linux-staging/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg)
    needs: resolve-version
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v3-

      - name: Build macOS Binaries (Apple Silicon & Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin -p pyxillum-app -p pyxillum-cli
          cargo build --release --target x86_64-apple-darwin -p pyxillum-app -p pyxillum-cli

      - name: Create Universal Mach-O Binaries
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/pyxillum-desktop \
            target/aarch64-apple-darwin/release/pyxillum-desktop \
            target/x86_64-apple-darwin/release/pyxillum-desktop

          lipo -create -output target/universal/pyxillum \
            target/aarch64-apple-darwin/release/pyxillum \
            target/x86_64-apple-darwin/release/pyxillum

      - name: Generate Apple ICNS Icon
        run: |
          mkdir -p pyxillum.iconset
          cp assets/icons/icon-16.png pyxillum.iconset/icon_16x16.png
          cp assets/icons/icon-32.png pyxillum.iconset/icon_16x16@2x.png
          cp assets/icons/icon-32.png pyxillum.iconset/icon_32x32.png
          cp assets/icons/icon-64.png pyxillum.iconset/icon_32x32@2x.png
          cp assets/icons/icon-128.png pyxillum.iconset/icon_128x128.png
          cp assets/icons/icon-256.png pyxillum.iconset/icon_128x128@2x.png
          cp assets/icons/icon-256.png pyxillum.iconset/icon_256x256.png
          cp assets/icons/icon-512.png pyxillum.iconset/icon_256x256@2x.png
          cp assets/icons/icon-512.png pyxillum.iconset/icon_512x512.png

          iconutil -c icns pyxillum.iconset -o pyxillum.icns

      - name: Package macOS App Bundles and Disk Images (.dmg)
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          mkdir -p macos-staging

          create_app_and_dmg() {
              local arch_label="$1"
              local bin_source="$2"
              local dmg_name="$3"

              local app_dir="build_${arch_label}/Pyxillum.app"
              mkdir -p "${app_dir}/Contents/MacOS"
              mkdir -p "${app_dir}/Contents/Resources"

              cp "${bin_source}" "${app_dir}/Contents/MacOS/pyxillum-desktop"
              chmod +x "${app_dir}/Contents/MacOS/pyxillum-desktop"
              cp pyxillum.icns "${app_dir}/Contents/Resources/pyxillum.icns"

              cat <<EOF > "${app_dir}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>pyxillum-desktop</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.pyxillum</string>
              <key>CFBundleName</key>
              <string>Pyxillum</string>
              <key>CFBundleDisplayName</key>
              <string>Pyxillum</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${version}</string>
              <key>CFBundleVersion</key>
              <string>${version}</string>
              <key>CFBundleIconFile</key>
              <string>pyxillum.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>Pyxillum requires Bluetooth Low Energy access to discover and control SP621E/SP6xxE pixel LED controllers.</string>
          </dict>
          </plist>
          EOF

              # Assemble DMG volume directory with Applications symlink
              local dmg_root="dmg_root_${arch_label}"
              mkdir -p "${dmg_root}"
              cp -R "${app_dir}" "${dmg_root}/"
              ln -s /Applications "${dmg_root}/Applications"

              hdiutil create -volname "Pyxillum" -srcfolder "${dmg_root}" -ov -format UDZO "macos-staging/${dmg_name}"
          }

          create_app_and_dmg "universal" "target/universal/pyxillum-desktop" "Pyxillum-macOS-Universal-v${version}.dmg"
          create_app_and_dmg "aarch64" "target/aarch64-apple-darwin/release/pyxillum-desktop" "Pyxillum-macOS-aarch64-v${version}.dmg"
          create_app_and_dmg "x86_64" "target/x86_64-apple-darwin/release/pyxillum-desktop" "Pyxillum-macOS-x64-v${version}.dmg"

          cli_stage="cli_staging"
          mkdir -p "${cli_stage}"
          cp target/universal/pyxillum "${cli_stage}/pyxillum"
          chmod +x "${cli_stage}/pyxillum"
          cp README.md "${cli_stage}/"
          cp LICENSE "${cli_stage}/"
          tar -czvf "macos-staging/pyxillum-cli-macOS-Universal-v${version}.tar.gz" -C "${cli_stage}" .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: macos-staging/*
          if-no-files-found: error

  publish-release:
    name: Publish Multi-Platform Release
    needs: [resolve-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release_assets

      - name: Download Linux x86_64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets-x86_64
          path: release_assets

      - name: Download Linux aarch64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets-aarch64
          path: release_assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: release_assets

      - name: Compute Unified SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          ls -lh release_assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "Pyxillum v${{ needs.resolve-version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ fromJson(github.event.inputs.prerelease || 'false') }}
          generate_release_notes: true
          files: release_assets/*
