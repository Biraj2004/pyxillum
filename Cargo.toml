[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/sim",
    "crates/transport",
    "crates/core",
    "crates/cli",
    "crates/app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
license = "AGPL-3.0-or-later"
authors = ["Pyxillum Contributors"]
repository = "https://github.com/example/pyxillum"

[workspace.dependencies]
thiserror = "1.0.64"
anyhow = "1.0.89"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = { version = "4.5.18", features = ["derive"] }
async-trait = "0.1.83"
proptest = "1.5.0"
btleplug = "0.11.7"
directories = "5.0.1"
eframe = "0.28.1"
egui = "0.28.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

