# Pyxillum Cross-Platform Icon Mapping Source of Truth
# Maps logical IconId to platform-native vector assets:
#   - Windows: Segoe Fluent Icons (Segoe UI Variable glyph code)
#   - macOS: Apple SF Symbols (San Francisco system icon name)
#   - Linux: GNOME Adwaita Symbolic (FreeDesktop spec icon name)

[icons.bluetooth]
description = "Bluetooth radio connectivity and pairing"
segoe_fluent = "\uE702"
sf_symbol = "antenna.radiowaves.left.and.right"
adwaita = "preferences-system-bluetooth-symbolic"

